[tool.poetry]
name = "enterprise-ai"
version = "0.1.0"
description = "Gemini Enterprise × Google Workspace 統合デモエージェント (ADK)"
authors = ["Demo Author <demo@example.com>"]
readme = "README.md"
packages = [{ include = "enterprise_ai" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
google-adk = ">=1.0.0"
google-cloud-discoveryengine = ">=0.13.0"
google-apps-chat = ">=0.2.0"
google-auth = ">=2.30.0"
python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
